name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        run: |
          flutter --version
          if [ ! -d android ]; then
            flutter create --platforms=android --org com.gaifd --project-name m365_dashboard .
          fi
          python3 tool/patch_android.py
          cat android/build.gradle.kts

      - name: Free disk space and preinstall NDK
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift || true
          df -h /
          NDK=$(grep -rhoE 'ndkVersion *= *"[0-9.]+"' android/app/build.gradle.kts | grep -oE '[0-9.]+' || true)
          if [ -z "$NDK" ]; then NDK=$(grep -rhoE 'ndkVersion *= *[0-9.]+' $FLUTTER_ROOT/packages/flutter_tools/gradle/src/main/kotlin/*.kt 2>/dev/null | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1); fi
          if [ -z "$NDK" ]; then NDK=28.2.13676358; fi
          echo "NDK $NDK"
          SDKM=$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager
          for i in 1 2 3; do
            yes | $SDKM --install "ndk;$NDK" > /tmp/ndk.log 2>&1 && break
            echo "NDK install attempt $i failed"; tail -3 /tmp/ndk.log
            rm -rf $ANDROID_SDK_ROOT/ndk/$NDK $ANDROID_SDK_ROOT/.temp
            sleep 5
          done
          ls $ANDROID_SDK_ROOT/ndk

      - name: Fonts
        run: |
          mkdir -p assets/fonts
          for w in Medium SemiBold Bold; do
            curl -fsSL -o assets/fonts/ChakraPetch-$w.ttf \
              https://raw.githubusercontent.com/google/fonts/main/ofl/chakrapetch/ChakraPetch-$w.ttf
          done

      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings || true
      - name: Build APK
        run: |
          set -o pipefail
          flutter test test/miauth_test.dart 2>&1 | tee build.log
          flutter build apk --release 2>&1 | tee -a build.log

      - name: Report build errors
        if: failure()
        run: |
          # Хвост лога и строки с ошибками — в аннотации, чтобы их было видно без скачивания логов.
          ERR=$(grep -iE "error|exception|failed|what went wrong|could not|unresolved|incompatible|requires" build.log | grep -v "^\s*at " | head -40)
          TAIL=$(tail -n 40 build.log)
          enc() { python3 -c 'import sys; s=sys.stdin.read()[-15000:]; print(s.replace("%","%25").replace("\r","").replace("\n","%0A"))'; }
          echo "::error title=errors::$(printf '%s' "$ERR" | enc)"
          echo "::error title=tail::$(printf '%s' "$TAIL" | enc)"

      - name: Signing certificate
        run: |
          APKSIGNER=$(ls -d $ANDROID_SDK_ROOT/build-tools/*/apksigner | sort -V | tail -1)
          $APKSIGNER verify --print-certs build/app/outputs/flutter-apk/app-release.apk | grep -i "SHA-256" | tee cert.txt
          echo "::notice title=cert::$(cat cert.txt)"

      - name: Rename APK
        run: |
          VER=$(grep '^version:' pubspec.yaml | sed 's/version: //; s/+.*//')
          cp build/app/outputs/flutter-apk/app-release.apk m365-dashboard-v$VER.apk

      - uses: actions/upload-artifact@v4
        with:
          name: m365-dashboard-apk
          path: m365-dashboard-v*.apk
