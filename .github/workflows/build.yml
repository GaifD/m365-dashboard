name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        run: |
          flutter --version
          if [ ! -d android ]; then
            flutter create --platforms=android --org com.gaifd --project-name m365_dashboard .
          fi
          python3 tool/patch_android.py

      - name: Fonts
        run: |
          mkdir -p assets/fonts
          for w in Medium SemiBold Bold; do
            curl -fsSL -o assets/fonts/ChakraPetch-$w.ttf \
              https://raw.githubusercontent.com/google/fonts/main/ofl/chakrapetch/ChakraPetch-$w.ttf
          done

      - name: Stable signing key (so updates install over the old version)
        run: |
          mkdir -p ~/.android
          cp tool/debug.keystore ~/.android/debug.keystore

      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings || true
      - run: flutter build apk --release

      - name: Rename APK
        run: |
          VER=$(grep '^version:' pubspec.yaml | sed 's/version: //; s/+.*//')
          cp build/app/outputs/flutter-apk/app-release.apk m365-dashboard-v$VER.apk

      - uses: actions/upload-artifact@v4
        with:
          name: m365-dashboard-apk
          path: m365-dashboard-v*.apk
