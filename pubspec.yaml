name: m365_dashboard
description: Дашборд для Xiaomi M365 Pro — скорость, расход Вт·ч/км, запас хода, диагностика батареи.
publish_to: 'none'
version: 0.3.2+5

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_blue_plus: 1.34.5
  permission_handler: ^11.3.1
  wakelock_plus: ^1.2.8
  shared_preferences: ^2.3.2
  pointycastle: ^3.9.1
  path_provider: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  fonts:
    - family: ChakraPetch
      fonts:
        - asset: assets/fonts/ChakraPetch-Medium.ttf
          weight: 500
        - asset: assets/fonts/ChakraPetch-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/ChakraPetch-Bold.ttf
          weight: 700
